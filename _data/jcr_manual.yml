# JCR indicators that are not in the JCR exports, checked by hand (Web of Science JCR or the publisher).
# bin/jcr_lookup.py uses an entry when an article's journal and JCR year match and the exports have no data for it.
# "indexed: false" means the journal is not in the JCR that year: the article shows no JCR line and is not counted.
# "quartile" is the best quartile of the journal; "categories" lists the WoS categories known for it (may be empty).

# Values from publisher pages
- journal: IEEE Access
  jcr_year: 2025
  jif: 4.2
  quartile: Q2
  categories: # quartile and category checked by hand in WoS JCR (November 2026)
    - { name: "Computer Science, Information Systems", quartile: Q2 }
  source: https://ieeeaccess.ieee.org/about/bibliometrics/ # "In the 2025 Journal Citation Reports (JCR), IEEE Access received: Impact factor of 4.2"
- journal: IEEE Geoscience and Remote Sensing Magazine
  jcr_year: 2025
  jif: 13.7
  quartile: Q1
  categories: # "#1 in Imaging Science, #1 in Remote Sensing (JIF: 13.7)"; rank 1 implies Q1
    - { name: Imaging Science, quartile: Q1 }
    - { name: Remote Sensing, quartile: Q1 }
  source: https://innovate.ieee.org/ieee-journals-continue-to-excel-in-citation-rankings/
- journal: IEEE/CAA Journal of Automatica Sinica
  jcr_year: 2024
  jif: 19.2
  quartile: Q1
  categories:
    - { name: Automation & Control Systems, quartile: Q1 }
  source: https://www.ieee-jas.net/news/index_tabliod_en/3d2adcbe-8e2c-4852-b8c8-4360ef04c72a_en.htm # "1/89, SCI Q1"

